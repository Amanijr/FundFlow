services:
  postgres:
    image: postgres:16-alpine
    container_name: fundflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fundflow}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fundflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fundflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fundflow-api:local
    container_name: fundflow-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fundflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-at-least-256-bit-secret-key-here}
      PLATFORM_BOOTSTRAP_SECRET: ${PLATFORM_BOOTSTRAP_SECRET:-local-dev-bootstrap-secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DEV_SEED_ENABLED: ${DEV_SEED_ENABLED:-true}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_URL: ${INTERNAL_API_URL:-http://api:8080}
    image: fundflow-web:local
    container_name: fundflow-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Used if the Next process re-reads env; rewrites are primarily build-time.
      API_URL: ${INTERNAL_API_URL:-http://api:8080}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  fundflow_pg_data:
