services:
  postgres:
    image: postgres:16-alpine
    container_name: fundflow-postgres
    environment:
      POSTGRES_DB: fundflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - fundflow_pg_data:/var/lib/postgresql/data

volumes:
  fundflow_pg_data:
