# Production profile — no dummy data. Activated by Docker (SPRING_PROFILES_ACTIVE=prod)
# or: java -jar app.jar --spring.profiles.active=prod
app.dev.seed-enabled=false

server.error.include-message=never
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
management.endpoint.health.show-details=never

# Must be supplied via environment (no sample defaults)
app.jwt.secret=${JWT_SECRET}
app.platform.bootstrap-secret=${PLATFORM_BOOTSTRAP_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
