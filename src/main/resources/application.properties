spring.application.name=fundflow-erp

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/fundflow
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=${JWT_SECRET:change-me-in-production-use-at-least-256-bit-secret-key-here}
app.jwt.expiration-ms=86400000

# Platform super admin bootstrap (set in production; used once to create first SUPER_ADMIN)
app.platform.bootstrap-secret=${PLATFORM_BOOTSTRAP_SECRET:local-dev-bootstrap-secret}

# API
server.error.include-message=always

# CORS (comma-separated origins for browser frontends)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Dev demo seed — matches frontend mock credentials (admin@demo.local / demo)
app.dev.seed-enabled=${DEV_SEED_ENABLED:false}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false

# Communications
communication.auto-receipt-enabled=true
communication.default-receipt-channel=EMAIL
