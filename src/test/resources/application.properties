spring.application.name=fundflow-erp-test

spring.datasource.url=jdbc:h2:mem:fundflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=false

app.jwt.secret=test-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
app.jwt.expiration-ms=3600000

communication.auto-receipt-enabled=true
communication.default-receipt-channel=EMAIL

app.platform.bootstrap-secret=test-bootstrap-secret
